name: Release

on:
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-r[0-9]*"
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-nightly.r[0-9]*"
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-beta.r[0-9]*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: pnpm install --frozen-lockfile --include=optional
      - env:
          NODE_OPTIONS: --experimental-ffi
        run: deno task release:prepare "${{ github.ref_name }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ github.ref_name }}-packages"
          path: artifacts/${{ github.ref_name }}/
          if-no-files-found: error

      - env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
        run: |
          deno eval '
            const release = JSON.parse(await Deno.readTextFile("artifacts/${{ github.ref_name }}/release.json"));
            for (const pkg of release.packages) {
              const jsrResponse = await fetch(`https://jsr.io/${pkg.jsrName}/meta.json`);
              const jsrMeta = jsrResponse.ok ? await jsrResponse.json() : { versions: {} };
              if (!jsrMeta.versions?.[pkg.version]) {
                const jsr = await new Deno.Command("deno", { args: ["publish"], cwd: `jsr/${pkg.module}`, stdin: "inherit", stdout: "inherit", stderr: "inherit" }).output();
                if (!jsr.success) Deno.exit(jsr.code);
              }
              const npmResponse = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.npmName)}/${pkg.version}`);
              if (!npmResponse.ok) {
                const npm = await new Deno.Command("pnpm", { args: ["publish", `../../artifacts/${{ github.ref_name }}/${pkg.tarball}`, "--access", "public", "--provenance", "--no-git-checks"], cwd: `npm/${pkg.module}`, stdin: "inherit", stdout: "inherit", stderr: "inherit" }).output();
                if (!npm.success) Deno.exit(npm.code);
              }
            }
          '

      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file "artifacts/${{ github.ref_name }}/CHANGELOG.md" artifacts/${{ github.ref_name }}/*.tgz
