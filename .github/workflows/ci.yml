name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: deno task fmt:check
      - run: deno task lint
      - run: deno task audit

  test:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: [deno, bun, node-ffi, node-koffi]
        include:
          - runtime: deno
            node-version: 22
          - runtime: bun
            node-version: 22
          - runtime: node-ffi
            node-version: 25
          - runtime: node-koffi
            node-version: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.runtime == 'bun'

      - run: pnpm install --frozen-lockfile --include=optional

      - if: matrix.runtime == 'deno'
        run: deno task test --deno

      - if: matrix.runtime == 'bun'
        run: deno task test --bun

      - if: matrix.runtime == 'node-ffi'
        env:
          NODE_OPTIONS: --experimental-ffi
        run: deno task test --node

      - if: matrix.runtime == 'node-koffi'
        run: pnpm --dir npm/is-elevated exec node -e "require.resolve('koffi')"

      - if: matrix.runtime == 'node-koffi'
        run: deno task test --node
